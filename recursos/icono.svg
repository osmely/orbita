<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icono de Órbita: el planeta y su anillo del logo, sobre la base redondeada de los iconos de macOS -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b52"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="planeta" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mitadDelantera"><rect x="0" y="512" width="1024" height="512"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fondo)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="512" cy="512" r="300" fill="url(#halo)"/>
  <!-- El anillo pasa por detrás del planeta (mitad de arriba) y por delante (mitad de abajo) -->
  <g transform="rotate(-25 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="118" fill="none" stroke="#67e8f9" stroke-width="22" stroke-opacity="0.9"/>
  </g>
  <circle cx="512" cy="512" r="190" fill="url(#planeta)"/>
  <g transform="rotate(-25 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="118" fill="none" stroke="#67e8f9" stroke-width="22" stroke-opacity="0.95" clip-path="url(#mitadDelantera)"/>
  </g>
</svg>
