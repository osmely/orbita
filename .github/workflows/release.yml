# Construye el ejecutable de Órbita para cada sistema y lo adjunta a la release de GitHub.
# Se lanza al subir una etiqueta de versión:  git tag v1.0.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, nombre: orbita-macos-arm64 }
          - { os: macos-13, nombre: orbita-macos-x64 }
          - { os: ubuntu-24.04, nombre: orbita-linux-x64 }
          - { os: windows-2022, nombre: orbita-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Node oficial: trae soporte para ejecutables (SEA); scripts/build.mjs lo usa con ORBITA_NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - run: npm ci
      - run: npm run build
        shell: bash
        env:
          ORBITA_NODE: ${{ runner.os == 'Windows' && 'node.exe' || 'node' }}
      - name: Comprimir
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "../${{ matrix.nombre }}.zip" orbita.exe; else zip "../${{ matrix.nombre }}.zip" orbita; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publicar la release con los ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "Órbita ${{ github.ref_name }}" --generate-notes
